<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Password | AI Code Reviewer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body class="auth-bg">

<div class="container-fluid vh-100 d-flex justify-content-center align-items-center py-4">

    <div class="auth-card-wrapper w-100" style="max-width: 480px;">
        <div class="card auth-card border-0 shadow-lg rounded-4 p-4 p-sm-5">
            
            <div class="text-center mb-4">
                <div class="icon-circle bg-success-subtle text-success mx-auto mb-3 d-flex justify-content-center align-items-center rounded-circle shadow-sm" style="width: 72px; height: 72px;">
                    <i class="bi bi-shield-lock-fill fs-1"></i>
                </div>
                <!-- Change to "Reset Password" if in resetpassword.html -->
                <h2 class="fw-bold text-dark mb-1">Secure Account</h2>
                <p class="text-muted small mb-0">Create a strong password for your workspace.</p>
            </div>

            <!-- Note: ID is passwordForm for create, resetPasswordForm for reset -->
            <form id="passwordForm" novalidate>
                <input type="hidden" id="email">

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small text-uppercase">New Password</label>
                    <div class="input-group input-group-lg has-validation">
                        <span class="input-group-text bg-light text-muted border-light"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control bg-light border-light" id="password" placeholder="Enter Password" autocomplete="new-password" required>
                        <button class="btn btn-light border-light bg-light text-muted" type="button" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                        <div class="invalid-feedback" id="passwordError"></div>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label class="form-label fw-bold text-muted small text-uppercase">Confirm Password</label>
                    <div class="input-group input-group-lg has-validation">
                        <span class="input-group-text bg-light text-muted border-light"><i class="bi bi-key-fill"></i></span>
                        <input type="password" class="form-control bg-light border-light" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" required>
                        <button class="btn btn-light border-light bg-light text-muted" type="button" id="toggleConfirmPassword">
                            <i class="bi bi-eye"></i>
                        </button>
                        <div class="invalid-feedback" id="confirmPasswordError"></div>
                    </div>
                </div>

                <!-- Strength Bar -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between mb-1">
                        <small class="fw-bold text-muted small text-uppercase">Password Strength</small>
                        <small id="strengthText" class="fw-bold text-muted small">None</small>
                    </div>
                    <div class="progress rounded-pill shadow-sm" style="height: 8px; background-color: #e2e8f0;">
                        <div id="strengthBar" class="progress-bar rounded-pill transition-base" style="width: 0%;"></div>
                    </div>
                </div>

                <!-- Password Rules -->
                <div class="password-rules-box bg-light p-3 rounded-4 border border-light mb-4 shadow-sm">
                    <small class="text-dark fw-bold d-block mb-2"><i class="bi bi-info-circle me-1"></i> Requirements:</small>
                    <ul class="list-unstyled mb-0 small fw-medium text-muted d-flex flex-column gap-1">
                        <li id="lengthRule"><i class="bi bi-circle me-2"></i>8 - 16 Characters</li>
                        <li id="letterRule"><i class="bi bi-circle me-2"></i>At least one Letter</li>
                        <li id="numberRule"><i class="bi bi-circle me-2"></i>At least one Number</li>
                        <li id="specialRule"><i class="bi bi-circle me-2"></i>At least one Special Character</li>
                    </ul>
                </div>

                <div id="message" class="mb-3"></div>

                <!-- ID is createPasswordBtn for create, resetBtn for reset -->
                <button type="submit" id="createPasswordBtn" class="btn btn-success w-100 py-3 rounded-pill fw-bold shadow-sm hover-lift mb-3">
                    <span id="spinner" class="spinner-border spinner-border-sm d-none me-2"></span>
                    <i class="bi bi-shield-check me-1"></i> Save Password
                </button>

                <div class="text-center">
                    <a href="login.html" class="text-muted small fw-bold text-decoration-none hover-link">
                        <i class="bi bi-arrow-left me-1"></i> Back to Login
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>
<script src="./js/resetpassword.js"></script>

</body>
</html>
