<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify OTP | AI Code Reviewer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body class="auth-bg">

<div class="container-fluid vh-100 d-flex justify-content-center align-items-center">

    <div class="auth-card-wrapper w-100" style="max-width: 480px;">
        <div class="card auth-card border-0 shadow-lg rounded-4 p-4 p-sm-5">
            
            <div class="text-center mb-4">
                <div class="icon-circle bg-blue-subtle text-primary mx-auto mb-3 d-flex justify-content-center align-items-center rounded-circle shadow-sm" style="width: 72px; height: 72px;">
                    <i class="bi bi-envelope-check-fill fs-1"></i>
                </div>
                <h2 class="fw-bold text-dark mb-1">OTP Verification</h2>
                <p class="text-muted small mb-0">Enter the 6-digit code sent to your email.</p>
            </div>

            <form id="otpForm" novalidate>
                <!-- Include userId if this is validate-otp.html, else it doesn't hurt -->
                <input type="hidden" id="userId">

                <div class="otp-container d-flex justify-content-between mb-4 gap-2">
                    <input type="text" class="form-control form-control-lg text-center fw-bold bg-light border-light otp-input shadow-sm" maxlength="1">
                    <input type="text" class="form-control form-control-lg text-center fw-bold bg-light border-light otp-input shadow-sm" maxlength="1">
                    <input type="text" class="form-control form-control-lg text-center fw-bold bg-light border-light otp-input shadow-sm" maxlength="1">
                    <input type="text" class="form-control form-control-lg text-center fw-bold bg-light border-light otp-input shadow-sm" maxlength="1">
                    <input type="text" class="form-control form-control-lg text-center fw-bold bg-light border-light otp-input shadow-sm" maxlength="1">
                    <input type="text" class="form-control form-control-lg text-center fw-bold bg-light border-light otp-input shadow-sm" maxlength="1">
                </div>

                <div class="text-danger small mb-3 text-center fw-semibold" id="otpError"></div>
                <div id="message" class="mb-3"></div>

                <button type="submit" class="btn btn-primary-gradient w-100 py-3 rounded-pill fw-bold shadow-sm hover-lift mb-4" id="verifyBtn">
                    <span id="spinner" class="spinner-border spinner-border-sm d-none me-2"></span>
                    <i class="bi bi-shield-check me-1"></i> Verify Code
                </button>

                <div class="text-center">
                    <a href="login.html" class="text-muted small fw-bold text-decoration-none hover-link">
                        <i class="bi bi-arrow-left me-1"></i> Back to Login
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="./js/otp.js"></script>

</body>
</html>
