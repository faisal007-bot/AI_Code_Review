<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | AI Code Reviewer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">

    <!-- Bootstrap & Flatpickr -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body class="auth-bg">

<div class="container-fluid vh-100 d-flex justify-content-center align-items-center">

    <div class="auth-card-wrapper w-100 position-relative" style="max-width: 480px;">
        
        <!-- Decorative Doodle -->
        <div class="position-absolute top-0 start-0 translate-middle d-none d-md-block" style="margin-top: 30px; margin-left: 30px; z-index: 20;">
            <div class="doodle-float">
                <div style="font-family: 'Caveat', cursive; color: #10b981; font-size: 1.8rem; white-space: nowrap; transform: rotate(-15deg);">
                    Join us! ✨
                </div>
            </div>
        </div>

        <div class="card auth-card border-0 shadow-lg rounded-4 p-4 p-sm-5">
            <div class="text-center mb-4">
                <div class="icon-circle bg-mint-subtle text-teal mx-auto mb-3 d-flex justify-content-center align-items-center rounded-circle shadow-sm" style="width: 72px; height: 72px;">
                    <i class="bi bi-person-plus-fill fs-1"></i>
                </div>
                <h2 class="fw-bold text-dark mb-1">Create Account</h2>
                <p class="text-muted small mb-0">Fill in your details to get started</p>
            </div>

            <form id="signupForm" novalidate>
                
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small text-uppercase" for="name">Full Name</label>
                    <div class="input-group input-group-lg has-validation">
                        <span class="input-group-text bg-light text-muted border-light"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control bg-light border-light" id="name" placeholder="John Doe" required autocomplete="name">
                        <div class="invalid-feedback">Please enter your name.</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small text-uppercase" for="email">Email Address</label>
                    <div class="input-group input-group-lg has-validation">
                        <span class="input-group-text bg-light text-muted border-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control bg-light border-light" id="email" placeholder="name@company.com" required autocomplete="email">
                        <div class="invalid-feedback">Enter a valid email address.</div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-muted small text-uppercase" for="contact">Contact Number</label>
                    <div class="input-group input-group-lg has-validation">
                        <span class="input-group-text bg-light text-muted border-light"><i class="bi bi-phone"></i></span>
                        <input type="text" class="form-control bg-light border-light" id="contact" maxlength="10" placeholder="1234567890" required autocomplete="tel">
                        <div class="invalid-feedback">Contact must contain exactly 10 digits.</div>
                    </div>
                </div>

                <div id="message" class="mb-3"></div>

                <button type="submit" class="btn btn-primary-gradient w-100 py-3 rounded-pill fw-bold shadow-sm hover-lift mb-4" id="signupBtn">
                    <span id="spinner" class="spinner-border spinner-border-sm d-none me-2"></span>
                    <i class="bi bi-rocket-takeoff me-1"></i> Create Account
                </button>

                <div class="text-center">
                    <span class="text-muted small">Already have an account?</span>
                    <a href="login.html" class="text-primary fw-bold ms-1 text-decoration-none hover-link">Sign In</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="./js/signup.js"></script>

</body>
</html>
